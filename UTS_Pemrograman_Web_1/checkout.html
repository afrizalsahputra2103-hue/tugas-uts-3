<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan | BukuKita</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="dashboard.html"><span class="brand-mark small">BK</span> BukuKita</a>
    <nav aria-label="Navigasi utama">
        <a href="dashboard.html">Dashboard</a><a href="stok.html">Katalog</a><a href="checkout.html" class="active">Pemesanan</a><a href="tracking.html">Tracking</a><a href="reports.html">Laporan</a><a href="history.html">History</a>
    </nav>
</header>
<main class="container">
    <div class="page-header"><div><p class="eyebrow">CHECKOUT</p><h1>Pemesanan Buku</h1><p class="muted">Tambah, ubah jumlah, atau hapus item pesanan.</p></div></div>

    <section class="checkout-layout">
        <div class="panel">
            <div class="section-heading"><h2>Data Pemesanan</h2></div>
            <div class="form-grid order-form">
                <div class="form-group"><label for="orderBook">Pilih Buku</label><select id="orderBook"></select></div>
                <div class="form-group"><label for="orderQty">Jumlah</label><input id="orderQty" type="number" min="1" value="1"></div>
            </div>
            <button class="btn btn-secondary" id="addOrderItem" type="button">+ Tambah ke Pesanan</button>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Buku</th><th>Harga</th><th>Qty</th><th>Subtotal</th><th>Aksi</th></tr></thead>
                    <tbody id="orderBody"></tbody>
                </table>
            </div>
        </div>

        <aside class="panel sticky-card">
            <h2>Informasi Pemesan</h2>
            <form id="checkoutForm">
                <div class="form-group"><label for="customerName">Nama Lengkap</label><input id="customerName" required></div>
                <div class="form-group"><label for="customerEmail">Email</label><input id="customerEmail" type="email" required></div>
                <div class="form-group"><label for="customerPhone">No. HP</label><input id="customerPhone" type="tel" required></div>
                <div class="form-group"><label for="address">Alamat Pengiriman</label><textarea id="address" rows="3" required></textarea></div>
                <div class="form-group"><label for="payment">Metode Pembayaran</label><select id="payment" required><option value="">Pilih</option><option>Transfer Bank</option><option>QRIS</option><option>E-Wallet</option><option>COD</option></select></div>
                <div class="summary-line"><span>Total</span><strong id="grandTotal">Rp0</strong></div>
                <button class="btn btn-primary btn-full" type="submit">Konfirmasi Pesanan</button>
            </form>
        </aside>
    </section>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let cart = JSON.parse(localStorage.getItem("cartBukuKita") || "[]");
const bookSelect = document.getElementById("orderBook");
const orderBody = document.getElementById("orderBody");
function populateBooks() {
    bookSelect.innerHTML = dataKatalogBuku.map(b => `<option value="${b.kode}">${b.judul} — ${formatRupiah(b.harga)}</option>`).join("");
}
function renderCart() {
    orderBody.innerHTML = cart.length ? cart.map((item, i) => `<tr><td>${item.judul}</td><td>${formatRupiah(item.harga)}</td><td><input class="qty-input" data-index="${i}" type="number" min="1" value="${item.qty}"></td><td>${formatRupiah(item.harga * item.qty)}</td><td><button class="btn btn-danger btn-small remove-item" data-index="${i}" type="button">Hapus</button></td></tr>`).join("") : `<tr><td colspan="5" class="empty-state">Belum ada item pesanan.</td></tr>`;
    document.getElementById("grandTotal").textContent = formatRupiah(cart.reduce((s,i) => s + i.harga * i.qty, 0));
    localStorage.setItem("cartBukuKita", JSON.stringify(cart));
}
document.getElementById("addOrderItem").addEventListener("click", () => {
    const book = dataKatalogBuku.find(b => b.kode === bookSelect.value);
    const qty = Number(document.getElementById("orderQty").value);
    if (!book || qty < 1) return showToast("Pilih buku dan jumlah yang valid.", "error");
    if (qty > book.stok) return showToast(`Stok ${book.judul} hanya ${book.stok}.`, "error");
    const existing = cart.find(i => i.kode === book.kode);
    if (existing) existing.qty += qty;
    else cart.push({kode: book.kode, judul: book.judul, harga: book.harga, qty});
    renderCart();
});
orderBody.addEventListener("input", e => {
    if (e.target.classList.contains("qty-input")) {
        const i = Number(e.target.dataset.index);
        cart[i].qty = Math.max(1, Number(e.target.value) || 1);
        renderCart();
    }
});
orderBody.addEventListener("click", e => {
    if (e.target.classList.contains("remove-item")) {
        cart.splice(Number(e.target.dataset.index), 1);
        renderCart();
    }
});
document.getElementById("checkoutForm").addEventListener("submit", e => {
    e.preventDefault();
    if (!cart.length) return showToast("Tambahkan minimal satu buku.", "error");
    const doNumber = "DO-" + Date.now().toString().slice(-8);
    const total = cart.reduce((s,i) => s + i.harga * i.qty, 0);
    const order = {
        id: "ORD-" + Date.now().toString().slice(-8),
        doNumber, nama: customerName.value.trim(), email: customerEmail.value.trim(),
        telepon: customerPhone.value.trim(), alamat: address.value.trim(),
        pembayaran: payment.value, total, items: [...cart], tanggal: new Date().toLocaleDateString("id-ID"),
        status: "Diproses"
    };
    dataPesanan.push(order);
    dataTransaksi.push({id: order.id, nama: order.nama, total: order.total, tanggal: order.tanggal, status: "Berhasil"});
    saveArray("dataPesanan", dataPesanan); saveArray("dataTransaksi", dataTransaksi);
    alert(`Pesanan berhasil dibuat!\nNomor DO: ${doNumber}\nTotal: ${formatRupiah(total)}`);
    cart = []; localStorage.removeItem("cartBukuKita"); renderCart(); e.target.reset();
});
populateBooks(); renderCart();
</script>
</body>
</html>
