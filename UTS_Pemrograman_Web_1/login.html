<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Toko Buku Kita">
    <title>Login | BukuKita</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card" aria-labelledby="login-title">
            <div class="brand-mark">BK</div>
            <p class="eyebrow">TOKO BUKU ONLINE</p>
            <h1 id="login-title">Selamat Datang</h1>
            <p class="muted">Masuk untuk mengelola pemesanan buku.</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="admin@bukakita.com" autocomplete="email" required>
                    <small class="error-text" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
                    <small class="error-text" id="passwordError"></small>
                </div>

                <button class="btn btn-primary btn-full" type="submit">Login</button>
            </form>

            <div class="auth-links">
                <button class="link-button" type="button" data-modal="forgotModal">Lupa Password</button>
                <span>•</span>
                <button class="link-button" type="button" data-modal="registerModal">Daftar</button>
            </div>

            <p class="demo-info"><strong>Demo:</strong> admin@bukakita.com / admin123</p>
        </section>
    </main>

    <div class="modal hidden" id="forgotModal" role="dialog" aria-modal="true" aria-labelledby="forgotTitle">
        <div class="modal-content">
            <button class="modal-close" type="button" aria-label="Tutup">&times;</button>
            <h2 id="forgotTitle">Lupa Password</h2>
            <p class="muted">Masukkan email untuk menerima instruksi reset password.</p>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="forgotEmail">Email</label>
                    <input type="email" id="forgotEmail" required>
                </div>
                <button class="btn btn-primary" type="submit">Kirim Instruksi</button>
            </form>
        </div>
    </div>

    <div class="modal hidden" id="registerModal" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
        <div class="modal-content">
            <button class="modal-close" type="button" aria-label="Tutup">&times;</button>
            <h2 id="registerTitle">Daftar Akun</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerName">Nama</label>
                    <input type="text" id="registerName" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" minlength="6" required>
                </div>
                <button class="btn btn-primary" type="submit">Buat Akun</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
