<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>History Transaksi | BukuKita</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark small">BK</span> BukuKita</a><nav><a href="dashboard.html">Dashboard</a><a href="stok.html">Katalog</a><a href="checkout.html">Pemesanan</a><a href="tracking.html">Tracking</a><a href="reports.html">Laporan</a><a href="history.html" class="active">History</a></nav></header>
<main class="container"><div class="page-header"><div><p class="eyebrow">TRANSACTION</p><h1>History Transaksi</h1><p class="muted">Riwayat transaksi yang tersimpan pada browser.</p></div><button class="btn btn-danger btn-small" id="clearHistory" type="button">Hapus History</button></div>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nama</th><th>Tanggal</th><th>Total</th><th>Status</th></tr></thead><tbody id="historyBody"></tbody></table></div></section></main>
<script src="js/data.js"></script><script src="js/app.js"></script><script>
function renderHistory(){document.getElementById("historyBody").innerHTML=dataTransaksi.map(t=>`<tr><td>${t.id}</td><td>${t.nama}</td><td>${t.tanggal}</td><td>${formatRupiah(t.total)}</td><td><span class="badge success">${t.status}</span></td></tr>`).join("")||`<tr><td colspan="5" class="empty-state">Belum ada transaksi.</td></tr>`;}
document.getElementById("clearHistory").addEventListener("click",()=>{if(confirm("Hapus semua history transaksi?")){dataTransaksi.length=0;saveArray("dataTransaksi",dataTransaksi);renderHistory();}});
renderHistory();
</script></body></html>
